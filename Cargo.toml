[workspace]
resolver = "2"
members = [
    "crates/svelte-ratatui-compiler",
    "crates/svelte-ratatui-runtime",
    "crates/svelte-ratatui-adapter",
    "crates/svelte-ratatui-cli",
    "crates/tauri-plugin-tui",
    "examples/tui-demo",
]

[workspace.package]
version = "0.7.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/plures/svelte-ratatui"
