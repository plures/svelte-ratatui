[package]
name = "svelte-ratatui-adapter"
description = "Runtime TUI adapter — bridges a headless Tauri webview to ratatui terminal rendering"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
svelte-ratatui-compiler = { path = "../svelte-ratatui-compiler" }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = "1"
